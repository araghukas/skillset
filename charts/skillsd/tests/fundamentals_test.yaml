suite: chart fundamentals
tests:
  # A released chart is packaged with --app-version set from the git tag, so
  # an unset image.tag must resolve to it. Getting this wrong ships a chart
  # that pulls the wrong image, or ":".
  - it: defaults the image tag to the chart appVersion
    templates:
      - deployment.yaml
      - deployment-registry.yaml
    chart:
      appVersion: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/araghukas/skillsd:1.2.3
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/araghukas/skillsd:1.2.3
        template: deployment.yaml

  - it: lets an explicit image tag win over appVersion
    templates:
      - deployment.yaml
    chart:
      appVersion: 1.2.3
    set:
      image.repository: localhost:5005/skillsd
      image.tag: dev
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: localhost:5005/skillsd:dev

  - it: honours an explicit namespace override
    templates:
      - deployment.yaml
      - deployment-registry.yaml
      - pvc-evidence.yaml
    set:
      namespace: skills-system
    asserts:
      - equal:
          path: metadata.namespace
          value: skills-system

  - it: drops the whole registry when disabled
    templates:
      - deployment-registry.yaml
      - service-registry.yaml
      - pvc-registry.yaml
      - pvc-evidence.yaml
    set:
      registry.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: converts MiB to bytes for the request-body limit
    templates:
      - deployment.yaml
    set:
      maxRequestBodyMiB: 8
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_REQUEST_BODY_BYTES
            value: "8388608"

  # A different unit than the request-body limit above (KiB, not MiB) -
  # this proves the unit conversion is actually wired to the right value,
  # not just copy-pasted from maxRequestBodyMiB.
  - it: converts KiB to bytes for the result limit
    templates:
      - deployment.yaml
    set:
      maxResultKiB: 256
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_RESULT_BYTES
            value: "262144"

  # Probes are the one thing a broken protocol switch would break silently:
  # a stale `grpc:` probe left in place would render without error but
  # never pass, and nothing short of a real deployment would catch it.
  - it: probes health over HTTP on both workloads
    templates:
      - deployment.yaml
      - deployment-registry.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.grpc
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.grpc

  # skillsd's volume, written by the init container, and must be read-only
  - it: mounts the skills volume read-only in the serving container
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      - notExists:
          path: spec.template.spec.initContainers[0].volumeMounts[0].readOnly

  - it: falls back to an emptyDir when evidence persistence is off
    templates:
      - deployment-registry.yaml
    set:
      registry.evidence.persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].name
          value: evidence-data
      - exists:
          path: spec.template.spec.volumes[1].emptyDir
      - notExists:
          path: spec.template.spec.volumes[1].persistentVolumeClaim

  - it: mounts the evidence volume at the directory holding the db file
    templates:
      - deployment-registry.yaml
    set:
      registry.evidence.dbPath: /var/lib/custom/evidence.db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: evidence-data
            mountPath: /var/lib/custom
