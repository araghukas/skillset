apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillsd.fullname" . }}
  namespace: {{ include "skillsd.namespace" . }}
  labels:
    {{- include "skillsd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "skillsd.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: skillsd
  template:
    metadata:
      labels:
        {{- include "skillsd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: skillsd
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "skillsd.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $auth := dict "auth" .Values.skillsRepo "label" "skillsRepo" }}
      volumes:
        - name: skills-data
          emptyDir: {}
        {{- with include "skillsd.githubAuthVolume" $auth | trim }}{{- . | nindent 8 }}{{- end }}
      initContainers:
        # Runs the skillsd image rather than a git image: GitHub App auth has
        # to sign a JWT and exchange it for a token before it can clone, and
        # doing that in shell is not worth it. See cmd/skillsd-init.
        - name: skills-clone
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/skillsd-init"]
          env:
            - name: SKILLS_REPO_URL
              value: {{ .Values.skillsRepo.url | quote }}
            - name: SKILLS_REPO_BRANCH
              value: {{ .Values.skillsRepo.branch | quote }}
            - name: SKILLS_DIR
              value: {{ .Values.mountPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.skillsRepo.apiBaseURL }}
            - name: GITHUB_API_BASE_URL
              value: {{ .Values.skillsRepo.apiBaseURL | quote }}
            {{- end }}
            {{- include "skillsd.githubAuthEnv" $auth | nindent 12 }}
          volumeMounts:
            - name: skills-data
              mountPath: {{ .Values.mountPath }}
            {{- with include "skillsd.githubAuthVolumeMount" $auth | trim }}{{- . | nindent 12 }}{{- end }}
      containers:
        - name: skillsd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: grpc
          env:
            - name: GRPC_ADDR
              value: {{ .Values.grpcAddr | quote }}
            - name: SKILLS_DIR
              value: {{ .Values.mountPath | quote }}
            - name: SKILLS_SUBPATH
              value: {{ .Values.skillsRepo.subPath | quote }}
            - name: GRPC_MAX_RECV_MSG_SIZE_BYTES
              value: {{ mul .Values.grpcMaxRecvMsgSizeMiB 1048576 | quote }}
            - name: GRPC_MAX_SEND_MSG_SIZE_BYTES
              value: {{ mul .Values.grpcMaxSendMsgSizeMiB 1048576 | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          volumeMounts:
            - name: skills-data
              mountPath: {{ .Values.mountPath }}
              readOnly: true
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
