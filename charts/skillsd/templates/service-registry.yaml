{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillsd.registryFullname" . }}
  namespace: {{ include "skillsd.namespace" . }}
  labels:
    {{- include "skillsd.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  type: {{ .Values.registry.service.type }}
  selector:
    {{- include "skillsd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: registry
  ports:
    - port: {{ .Values.registry.service.port }}
      targetPort: http
      name: http
{{- end }}
