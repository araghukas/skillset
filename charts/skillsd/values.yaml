namespace: ""

replicaCount: 2

image:
  repository: skillsd
  tag: latest
  pullPolicy: IfNotPresent

grpcAddr: ":8080"

# logLevel sets the minimum slog level for skillsd and skillsd-registry.
logLevel: info

# grpcMaxRecvMsgSizeMiB / grpcMaxSendMsgSizeMiB cap the size (in MiB) of a
# single incoming/outgoing gRPC message (grpc.MaxRecvMsgSize /
# grpc.MaxSendMsgSize). gRPC-Go itself defaults both to 4 MiB; the send side
# matters here for GetSkillAtRef responses that include context files.
grpcMaxRecvMsgSizeMiB: 8
grpcMaxSendMsgSizeMiB: 8

service:
  type: ClusterIP
  port: 8080

# skillsRepo configures the init container that clones the skill
# definitions into a shared, read-only (from the main container's
# perspective) volume before skillsd starts.
skillsRepo:
  # url is the HTTPS clone URL of the skills repository, e.g.
  # "https://github.com/example/skills.git".
  url: ""
  # branch is checked out with a shallow (--depth 1) clone.
  branch: main
  # subPath is an optional subdirectory within the repo under which skill
  # directories actually live. Leave empty if skills sit at the repo root.
  subPath: skills

  # Authentication for the clone. Set githubApp (recommended) or
  # tokenSecret, not both; leave both empty for a public, unauthenticated
  # clone.
  #
  # githubApp is a GitHub App installation with "Contents: Read" on the
  # repo.
  githubApp:
    # appId is the app's client ID ("Iv23...") or its numeric app ID -
    # either works. Note this is NOT the installation ID below.
    appId: ""
    # installationId identifies the installation of the app to act as. An
    # app is installed separately on each account or organization that
    # adopts it; find this in the installation's settings URL.
    installationId: ""
    # privateKeySecret is the name of an existing secret holding the app's
    # private key under the key "private-key.pem". Mounted as a file, not
    # an env var.
    privateKeySecret: ""

  # tokenSecret is the name of an existing secret containing a token (key
  # "token") with read access to the repo - a fine-grained PAT, or a Gitea
  # token. Simpler than a GitHub App, and the only option against hosts
  # that have no GitHub App equivalent.
  tokenSecret: ""

  # apiBaseURL overrides the API base used to exchange the app's JWT for an
  # installation token, for GitHub Enterprise. Only read in githubApp mode.
  apiBaseURL: ""

# mountPath is where the cloned repo is mounted in both the init container
# (read-write) and the main container (read-only). Also set as SKILLS_DIR.
mountPath: /skills

resources: {}

# registry configures the skillsd-registry component: a single-replica,
# persistent write path that lets AI agents propose changes to skills as git
# commits and submit them as GitHub pull requests for human review, and that
# collects the outcome reports backing those proposals (see evidence below).
#
# Deployed by default. Setting enabled: false drops it entirely, leaving the
# read-only skillsd fleet above to run standalone - a read-only deployment
# with no propose or evidence path at all.
registry:
  enabled: true

  image:
    repository: skillsd
    tag: latest
    pullPolicy: IfNotPresent

  # grpcAddr is passed through as GRPC_ADDR; service.port must match its
  # port number.
  grpcAddr: ":8081"

  service:
    type: ClusterIP
    port: 8081

  # fetchInterval is how often the base branch is re-fetched from origin in
  # the background, so reads stay fresh without a network round-trip per
  # request. Unlike skillsd's static, once-loaded index, this component is
  # meant to track live upstream state.
  fetchInterval: 5m

  # grpcMaxRecvMsgSizeMiB / grpcMaxSendMsgSizeMiB cap the size (in MiB) of a
  # single incoming/outgoing gRPC message. The recv side bounds a whole
  # ProposeChangeRequest (every FileChange in the call counts against it);
  # the send side matters for GetProposal's diff and GetSkillAtRef's
  # context files. gRPC-Go itself defaults both to 4 MiB.
  grpcMaxRecvMsgSizeMiB: 8
  grpcMaxSendMsgSizeMiB: 8

  # maxFileContentSizeMiB caps a single proposed file's content (in MiB)
  # before ProposeChange rejects it with a clear application-level error,
  # rather than letting a large blob into repo history or the gRPC
  # transport reject it with a confusing ResourceExhausted.
  maxFileContentSizeMiB: 1

  # repoDir is where the git working copy is kept, inside the PVC below.
  repoDir: /var/lib/skillsd-registry

  persistence:
    size: 1Gi
    storageClassName: ""

  skillsRepo:
    # url is the HTTPS clone URL of the skills repository. Usually the same
    # value as skillsRepo.url above.
    url: ""
    # baseBranch is the branch proposals fork from and pull requests target.
    baseBranch: main
    # subPath is an optional subdirectory within the repo under which skill
    # directories actually live. Leave empty if skills sit at the repo root.
    subPath: skills

  # submitProposalEnabled controls whether the SubmitProposal RPC is allowed
  # to push a proposal's branch and open a pull request. ProposeChange,
  # GetProposal, ListProposals, and GetSkillAtRef all work regardless -
  # this only gates the final push+PR step. Setting it false is the explicit
  # way to run propose-only; configuring no credential under github below
  # has the same effect implicitly.
  submitProposalEnabled: true

  # autoSubmitEndorsements is how many agents must independently arrive at
  # byte-identical content before a pull request is opened for it with
  # nobody asking. When a second agent proposes content that already exists,
  # it doesn't get its own branch: it's recorded as an endorsement of the
  # first, and this counts those endorsements.
  #
  # 0 (the default) disables it, and that default is deliberate. This is the
  # only setting that lets the registry act on its own, and it is exactly as
  # trustworthy as agent_id is - with self-asserted identities, a single
  # misconfigured caller can manufacture a threshold's worth of agreement by
  # itself. Turn it on once callers are authenticated.
  autoSubmitEndorsements: 0

  # evidence configures EvidenceService: the store of agent outcome reports
  # that turns "an agent wants to change this skill" into "this version of
  # the skill was cited by N reported sessions and contradicted reality in
  # M% of them". It is the only part of skillset whose data is not derived
  # from git - see persistence and backup below.
  evidence:
    enabled: true

    # dbPath is the SQLite file, inside the evidence volume below.
    dbPath: /var/lib/skillsd-evidence/evidence.db

    # verifyCommits makes ReportOutcome reject reports naming a
    # skill/commit pair the repository doesn't contain. This is the main
    # thing keeping a misconfigured agent from quietly filling the store
    # with rows that look like signal.
    #
    # A report can be rejected simply for naming a commit newer than the
    # registry's last fetch of the base branch; that returns
    # FailedPrecondition, and since report IDs make retries idempotent, the
    # agent's correct response is to retry shortly.
    verifyCommits: true

    # retention is how long individual reports are kept before being folded
    # into per-(skill, commit, verdict) counts and deleted. The aggregate
    # signal survives forever; the free-text notes and individual report
    # IDs do not.
    #
    # Setting this to 0 disables the rollup and lets the database grow
    # without bound, which surfaces as a registry that can no longer accept
    # writes. Only reasonable for a short-lived test deployment.
    retention: 2160h # 90 days
    rollupInterval: 24h

    # persistence is the PVC backing dbPath above - the evidence store's
    # only piece of non-git state.
    persistence:
      # enabled: false uses an emptyDir instead, so the evidence database
      # is lost on pod restart. Only reasonable for a short-lived test
      # deployment.
      enabled: true
      size: 1Gi
      # storageClassName: "" uses the cluster's default StorageClass.
      storageClassName: ""

    backup:
      # path is where periodic snapshots are written. Empty disables them.
      #
      # Worth setting to something that isn't the evidence volume itself: a
      # snapshot sitting on the disk it is meant to protect against losing
      # is not a backup. Point it at a second volume, or at a path your
      # cluster's backup tooling already collects.
      path: ""
      interval: 24h

  github:
    # owner/repo identify the GitHub repository pull requests are opened
    # against. Required only if submitProposalEnabled is true.
    owner: ""
    repo: ""

    # Authentication for everything this component does against the remote -
    # one credential, not several: the initial clone of skillsRepo.url into
    # repoDir, the periodic base-branch fetch, the HTTPS push, and the
    # pull-request API call. Set githubApp (recommended) or tokenSecret, not
    # both.
    #
    # Leaving both empty runs in propose-only mode (SubmitProposal
    # disabled), which is viable only against a public repo - a private one
    # still needs a credential here just to clone and fetch.
    #
    # Whichever is used needs write access here, unlike skillsRepo above:
    # "Contents: Read and write" plus "Pull requests: Read and write". It can
    # be the same GitHub App installation skillsRepo.githubApp uses, if that
    # app's permissions cover both.
    githubApp:
      # appId is the app's client ID ("Iv23...") or its numeric app ID.
      appId: ""
      # installationId identifies the installation to act as - a separate
      # value from appId.
      installationId: ""
      # privateKeySecret is an existing secret holding the app's private
      # key under the key "private-key.pem".
      privateKeySecret: ""

    # tokenSecret is an existing secret containing a token (key "token").
    tokenSecret: ""

    # apiBaseURL overrides the GitHub API base, for GitHub Enterprise - and
    # for the local Gitea stand-in, whose pull-request API mirrors GitHub's.
    # Also the host the app's JWT is exchanged at in githubApp mode.
    apiBaseURL: "https://api.github.com"

  resources: {}

podAnnotations: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
