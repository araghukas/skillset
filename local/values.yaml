# Helm values override for local (Tilt/kind) development. Passed to the
# charts/skillsd chart via the Tiltfile; not used outside local dev.
replicaCount: 1

logLevel: debug

image:
  repository: localhost:5005/skillsd
  tag: dev
  pullPolicy: IfNotPresent

skillsRepo:
  # Point this at a real (or throwaway public) skills repo to test against.
  url: "git@github.com:anthropics/skills.git"
  branch: main
  # Left empty here; the Tiltfile sets this to a generated secret name if
  # local/git-deploy-key and local/git-known-hosts are both present.
  existingSecret: ""

# registry is only actually deployed if local/github-token is present (see
# Tiltfile) - fill in skillsRepo.url/github.owner+repo here first if you
# want to exercise the proposal/PR write path locally.
registry:
  skillsRepo:
    # HTTPS, not ssh:// - registry.github.tokenSecret authenticates both
    # the push and the PR API. Needs push access on whatever repo/branch
    # this points at.
    url: ""
    baseBranch: main
  github:
    owner: ""
    repo: ""
