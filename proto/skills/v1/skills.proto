syntax = "proto3";

package skills.v1;

option go_package = "github.com/araghukas/skillset/gen/skills/v1;skillsv1";

import "google/protobuf/timestamp.proto";

// ==========================================
// Service Definition
// ==========================================

service SkillService {
  // Discovery & Context
  // Fetches available skills, their JSON schemas, and co-located context files.
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);

  // Fetches detailed metadata and context files for a specific skill.
  rpc GetSkill (GetSkillRequest) returns (GetSkillResponse);
}

// ==========================================
// Discovery Data Structures
// ==========================================

// Represents non-code supporting context files (e.g., prompt templates, SQL schemas, docs)
message SkillContextFile {
  string file_path = 1;  // Relative path within the skill directory (e.g., "prompts/template.txt")
  string content   = 2;  // File content encoded as UTF-8 string
  string mime_type = 3;  // e.g., "text/plain", "application/sql", "text/markdown"
}

// Complete metadata footprint for an individual skill, per the
// agentskills.io SKILL.md frontmatter spec (https://agentskills.io/specification).
message SkillMetadata {
  string name = 1;                     // Required; must match the skill's directory name
  string description = 2;              // Required; what the skill does and when to use it
  string license = 3;                  // Optional
  string compatibility = 4;            // Optional; environment requirements (e.g. "requires docker")
  map<string, string> metadata = 5;    // Optional; arbitrary client-defined key-value extensions
  string allowed_tools = 6;            // Optional, experimental; space-separated pre-approved tools
  string json_schema = 7;              // Optional; convenience projection of metadata["json_schema"], for skills that also expose a strict function-call interface
  repeated SkillContextFile context_files = 8; // SKILL.md plus any scripts/, references/, assets/ files
}

// ==========================================
// Request & Response Messages
// ==========================================

message ListSkillsRequest {
  string category = 1;                 // Filter to skills whose metadata["category"] matches exactly; empty returns all
  bool include_context_files = 2;      // Set true to fetch supporting context files alongside schemas
}

message ListSkillsResponse {
  repeated SkillMetadata skills = 1;
  google.protobuf.Timestamp indexed_at = 2;
}

message GetSkillRequest {
  string skill_name = 1;
  bool include_context_files = 2;
}

message GetSkillResponse {
  SkillMetadata skill = 1;
}
