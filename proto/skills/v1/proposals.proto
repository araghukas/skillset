syntax = "proto3";

package skills.v1;

option go_package = "github.com/araghukas/skillset/gen/skills/v1;skillsv1";

import "google/protobuf/timestamp.proto";
import "skills/v1/skills.proto";

// ==========================================
// Service Definition
// ==========================================

// ProposalService lets an AI agent propose edits to an existing skill as a
// real git commit on a dedicated branch, inspect that proposal (including
// its diff against the base branch), view a skill as of any ref, and -
// once ready for human review - submit the proposal as a GitHub pull
// request. Proposal state lives entirely in the underlying git repository.
service ProposalService {
  // Commits one or more full-content file changes to a skill on a proposal
  // branch, creating the branch (from the current base branch HEAD) if it
  // doesn't already exist, or appending a commit to it otherwise.
  //
  // If another agent's open proposal for the same skill already produces
  // byte-identical content (modulo whitespace normalization), no new branch
  // is created: the caller is recorded as an endorser of that existing
  // proposal and it is returned instead. See ProposeChangeResponse.
  rpc ProposeChange (ProposeChangeRequest) returns (ProposeChangeResponse);

  // Groups a skill's open proposals into clusters of proposals that edit
  // overlapping regions of the same files - competing answers to what is
  // probably the same defect. Purely derived from branch state; nothing is
  // stored.
  rpc ListProposalClusters (ListProposalClustersRequest) returns (ListProposalClustersResponse);

  // Lists proposals, optionally filtered by skill and/or proposing agent.
  rpc ListProposals (ListProposalsRequest) returns (ListProposalsResponse);

  // Fetches a single proposal, including its unified diff against base.
  rpc GetProposal (GetProposalRequest) returns (Proposal);

  // Fetches a skill's metadata and context files as of an arbitrary ref
  // (a branch name or a commit SHA); an empty ref resolves to the current
  // base branch HEAD.
  rpc GetSkillAtRef (GetSkillAtRefRequest) returns (GetSkillResponse);

  // Pushes a proposal's branch upstream and opens a GitHub pull request
  // against the base branch for human review.
  rpc SubmitProposal (SubmitProposalRequest) returns (SubmitProposalResponse);
}

// ==========================================
// Data Structures
// ==========================================

// FileChange is one file's full new content within a proposal. Proposals
// carry complete file contents rather than patches: the server computes the
// diff itself, so callers never need to worry about patch/context lines or
// applying a patch against a base they may not have in sync.
message FileChange {
  string file_path = 1;  // Relative path within the skill directory
  bool deleted = 2;       // If true, the file is removed; content is ignored
  string content = 3;     // Full new file content, encoded as UTF-8
}

message CommitInfo {
  string sha = 1;
  string message = 2;
  string author = 3;
  google.protobuf.Timestamp authored_at = 4;
}

// Endorsement records that an agent independently arrived at exactly the
// content a proposal already contains. There is deliberately no RPC to
// endorse a proposal you have merely read and agreed with: an endorsement is
// only meaningful as evidence if it was produced without knowledge of the
// proposal it lands on, so the only way to create one is for ProposeChange
// to find your content already there.
//
// Endorsements live in git as refs under refs/endorsements/, not in a
// database, so they survive exactly as long as the repository does.
message Endorsement {
  string agent_id = 1;
  string endorsed_sha = 2;   // Proposal head at the moment of endorsement
  bool stale = 3;            // True if the proposal has advanced since; stale endorsements don't count toward the auto-submit threshold
  google.protobuf.Timestamp endorsed_at = 4;
}

// Proposal is a single agent's line of edits to one skill, tracked as a
// branch in the underlying git repository.
message Proposal {
  string proposal_id = 1;         // Caller-chosen slug, unique per (agent_id, skill_name)
  string branch = 2;              // Full branch name: proposals/<agent_id>/<skill_name>/<proposal_id>
  string skill_name = 3;
  string agent_id = 4;
  string base_sha = 5;            // Base branch commit this proposal forked from
  string head_sha = 6;            // Current tip of the proposal branch
  string diff = 7;                // Unified diff, head vs base
  repeated CommitInfo commits = 8;
  string source_thread_uri = 9;   // Pointer to the agent's uploaded conversation JSON, if provided
  google.protobuf.Timestamp updated_at = 10;

  // content_hash is a normalized digest of every file in the skill's
  // directory at head_sha. Two proposals with the same content_hash produce
  // the same skill, whatever route they took to get there; it's the key
  // ProposeChange deduplicates on.
  string content_hash = 11;

  // endorsements are other agents that independently produced this exact
  // content. The proposing agent is not counted among them.
  repeated Endorsement endorsements = 12;

  // corroboration is 1 (the proposing agent) plus the number of non-stale
  // endorsements: how many agents independently arrived at this content.
  int32 corroboration = 13;

  // motivating_report_ids are EvidenceService report IDs the proposing agent
  // cited as the reason for this change, carried in commit trailers.
  repeated string motivating_report_ids = 14;
}

// ==========================================
// Request & Response Messages
// ==========================================

message ProposeChangeRequest {
  string skill_name = 1;
  string agent_id = 2;
  string proposal_id = 3;
  repeated FileChange files = 4;
  string commit_message = 5;
  string source_thread_uri = 6;

  // motivating_report_ids are EvidenceService report IDs that motivated this
  // change. Supplying them is what makes a proposal arrive carrying its own
  // evidence, so a reviewer can see the failures it claims to fix rather
  // than taking the change on faith. Optional, and not validated against the
  // evidence store - the registry runs fine with EvidenceService disabled.
  repeated string motivating_report_ids = 7;

  // allow_duplicate skips the content-hash dedup check and forces a branch
  // of the caller's own even if an identical proposal already exists. Rarely
  // wanted; endorsing the existing proposal is almost always better.
  bool allow_duplicate = 8;
}

message ProposeChangeResponse {
  // proposal is the caller's own proposal, or - when deduplicated is true -
  // the pre-existing proposal the caller was recorded as endorsing.
  Proposal proposal = 1;

  // deduplicated is true if an open proposal already produced identical
  // content, so no new branch was created. The caller's contribution was
  // recorded as an Endorsement on the returned proposal instead.
  bool deduplicated = 2;

  // auto_submitted is set if this call pushed the returned proposal's
  // corroboration to the configured threshold and a pull request was opened
  // automatically as a result.
  SubmitProposalResponse auto_submitted = 3;
}

message ListProposalsRequest {
  string skill_name = 1;  // Optional filter
  string agent_id = 2;    // Optional filter
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
}

message GetProposalRequest {
  string branch = 1;  // Fully-qualified branch name, as returned in Proposal.branch
}

message GetSkillAtRefRequest {
  string skill_name = 1;
  string ref = 2;                       // Branch name or commit SHA; empty = base branch HEAD
  bool include_context_files = 3;
}

message SubmitProposalRequest {
  string branch = 1;     // Fully-qualified branch name, as returned in Proposal.branch
  string pr_title = 2;   // Optional; defaulted from the proposal's commits if empty
  string pr_body = 3;    // Optional; defaulted (includes source_thread_uri) if empty
}

message SubmitProposalResponse {
  string pull_request_url = 1;
  int64 pull_request_number = 2;
}

// ProposalCluster is a set of open proposals for one skill whose diffs touch
// overlapping line ranges of the same files. Overlap is the signal: two
// agents rewriting the same passage are almost certainly responding to the
// same defect, even when their fixes differ and their content hashes don't
// match. Non-overlapping proposals are left alone - they're orthogonal edits
// that happen to share a skill.
//
// Clusters are recomputed from branch state on every call. Nothing about
// them is stored, and no judgment is applied: the server measures whether
// independent agents converged on the same region, never whether any of
// their proposals is good.
message ProposalCluster {
  repeated Proposal proposals = 1;

  // contested_paths are the files more than one proposal in this cluster
  // modifies, sorted.
  repeated string contested_paths = 2;

  // distinct_agents counts unique agent IDs across every proposal in the
  // cluster and their non-stale endorsements.
  int32 distinct_agents = 3;
}

message ListProposalClustersRequest {
  string skill_name = 1;  // Optional filter

  // include_singletons returns clusters of one proposal too. Off by default:
  // the point of clustering is to surface contention.
  bool include_singletons = 2;
}

message ListProposalClustersResponse {
  // clusters are sorted by distinct_agents, descending - the review queue,
  // most-corroborated first.
  repeated ProposalCluster clusters = 1;
}
