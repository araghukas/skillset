syntax = "proto3";

package skills.v1;

option go_package = "github.com/araghukas/skillset/gen/skills/v1;skillsv1";

import "google/protobuf/timestamp.proto";

// ==========================================
// Service Definition
// ==========================================

// EvidenceService collects outcome reports from agents that used a skill and
// aggregates them into per-skill, per-commit signals.
//
// It exists because the one thing a git host cannot see is whether a skill
// actually worked. A pull request that says "agent-7 wants to change this"
// is worth little to a reviewer; one that says "this version of the skill
// was cited by 142 reported sessions and contradicted reality in 18% of
// them, up from 2% on the previous commit" is worth a great deal, and the
// difference is entirely this service.
//
// It is served by skillsd-registry (the single-writer component), never by
// the read-only skillsd fleet: keeping the read path stateless is what lets
// it scale horizontally. It may be disabled entirely, in which case these
// RPCs return Unimplemented and the rest of the registry works unchanged.
service EvidenceService {
  // Records one agent session's outcome for every skill that session used.
  // Idempotent on report_id, so an agent can safely retry through a
  // registry restart without double-counting.
  rpc ReportOutcome (ReportOutcomeRequest) returns (ReportOutcomeResponse);

  // Aggregates reports into one row per (skill, commit): how many sessions
  // reported using it and how they turned out. This is the "what should I
  // fix next" query.
  rpc ListSkillSignals (ListSkillSignalsRequest) returns (ListSkillSignalsResponse);

  // Returns the individual reports behind a signal, so an agent about to
  // propose a fix can read what actually went wrong and cite the report IDs
  // in ProposeChange.motivating_report_ids.
  rpc ListOutcomeReports (ListOutcomeReportsRequest) returns (ListOutcomeReportsResponse);
}

// ==========================================
// Data Structures
// ==========================================

// Verdict is how one skill fared in one session. The values are deliberately
// observable outcomes rather than a satisfaction rating: an agent's opinion
// of whether a skill was "good" is noise, but whether it had to work around
// the skill, or the skill's instructions were contradicted by reality, is a
// fact about the session. Each value also implies a different repair.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;

  // The skill was followed as written and nothing contradicted it. This is
  // the denominator - report it, or the rates below mean nothing.
  VERDICT_APPLIED = 1;

  // Followed, but the agent had to adjust or work around some part of it.
  // Implies: the content is stale or imprecise.
  VERDICT_APPLIED_WITH_CORRECTION = 2;

  // Reality disagreed with the skill - a documented command failed, a named
  // API didn't exist, a stated invariant didn't hold.
  // Implies: the content is wrong.
  VERDICT_CONTRADICTED = 3;

  // The skill was on-topic but didn't cover the case at hand; the agent had
  // to go outside it.
  // Implies: the content has a gap.
  VERDICT_INCOMPLETE = 4;

  // The skill was loaded, then turned out to be irrelevant to the task.
  // Implies: the frontmatter `description` over-triggers. This one is easy
  // to overlook and expensive to ignore - a skill that keeps getting loaded
  // for the wrong tasks burns context across the whole fleet, and no human
  // is positioned to notice.
  VERDICT_NOT_APPLICABLE = 5;
}

// SkillOutcome is how one skill fared within one reported session.
message SkillOutcome {
  string skill_name = 1;

  // skill_commit is the SKILL.md revision that was used, as returned in
  // SkillMetadata.commit. Required: a report that doesn't say which version
  // it is about can't distinguish a fix from a regression.
  string skill_commit = 2;

  Verdict verdict = 3;

  // note is free text - what specifically went wrong. Ignored for
  // VERDICT_APPLIED. This is what a reviewer reads, so be concrete:
  // the command that failed, the instruction that was wrong.
  string note = 4;
}

// OutcomeReport is one stored (session, skill) observation.
message OutcomeReport {
  string report_id = 1;
  string agent_id = 2;
  string session_id = 3;
  string skill_name = 4;
  string skill_commit = 5;
  Verdict verdict = 6;
  string note = 7;
  google.protobuf.Timestamp reported_at = 8;
}

message VerdictCount {
  Verdict verdict = 1;
  int64 count = 2;
}

// SkillSignal is the aggregate for one (skill, commit) pair.
message SkillSignal {
  string skill_name = 1;
  string skill_commit = 2;

  // reported_sessions is the number of distinct sessions that reported using
  // this skill at this commit. It is NOT the number of sessions that used
  // it: reporting is voluntary and a session that crashed never reports, so
  // every rate below is "among sessions that reported", never "among
  // sessions". Do not present these as true rates.
  int64 reported_sessions = 3;

  repeated VerdictCount verdict_counts = 4;

  // defect_rate is the share of reported sessions with a verdict implying
  // the skill's content is wrong, stale, or incomplete
  // (APPLIED_WITH_CORRECTION, CONTRADICTED, INCOMPLETE).
  double defect_rate = 5;

  // not_applicable_rate is tracked separately from defect_rate because it
  // implies a different repair: the body of the skill may be perfect and
  // its `description` still be miscalibrated.
  double not_applicable_rate = 6;

  google.protobuf.Timestamp first_reported_at = 7;
  google.protobuf.Timestamp last_reported_at = 8;
}

// ==========================================
// Request & Response Messages
// ==========================================

message ReportOutcomeRequest {
  // report_id is a caller-generated unique ID (a UUID is fine) that makes
  // this call idempotent: re-sending a report_id already stored is accepted
  // and changes nothing. Generate it once, before the first attempt, and
  // reuse it on every retry.
  string report_id = 1;

  string agent_id = 2;

  // session_id identifies the agent session this report covers. One report
  // per session, listing every skill the session used.
  string session_id = 3;

  // skills is every skill the session used, including the ones that worked -
  // omitting those inflates every defect rate this service computes.
  repeated SkillOutcome skills = 4;
}

message ReportOutcomeResponse {
  // recorded is false if report_id had already been stored, meaning this
  // call was an idempotent replay and nothing changed. Not an error.
  bool recorded = 1;
}

message ListSkillSignalsRequest {
  string skill_name = 1;  // Optional filter

  // min_reported_sessions suppresses rows built on too little data to read
  // anything into. Defaults to 1.
  int32 min_reported_sessions = 2;
}

message ListSkillSignalsResponse {
  // signals are sorted by skill name, then by first_reported_at ascending,
  // so successive commits of one skill read in the order they were observed
  // and a rising defect_rate is visible by eye.
  repeated SkillSignal signals = 1;
}

message ListOutcomeReportsRequest {
  string skill_name = 1;
  string skill_commit = 2;         // Optional filter
  Verdict verdict = 3;             // Optional filter; VERDICT_UNSPECIFIED returns all
  bool exclude_empty_notes = 4;    // Skip reports with no note - usually the APPLIED ones
  int32 limit = 5;                 // Defaults to 100
}

message ListOutcomeReportsResponse {
  // reports are sorted most-recent-first.
  repeated OutcomeReport reports = 1;
}
